{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <title>Login</title>
</head>
<body>
    <section class="min-vh-100 gradient-custom d-flex align-items-center justify-content-center">
        <div class="container py-5">
            <div class="row d-flex justify-content-center align-items-center">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <div class="card text-white" style="border-radius: 1rem;">
                        <div class="card-body p-3 p-md-5 text-center">
                            <div class="mb-3 mb-md-5 mt-2 mt-md-4 pb-2 pb-md-5">
                                <h2 class="h3 fw-bold mb-2 text-uppercase">Login</h2>
                                <p class="text-white-50 mb-3 mb-md-4">Please enter your login and password!</p>
                                {% if msg %}
                                    <div class="alert alert-info">{{ msg }}</div>
                                {% endif %}
                                <form method="post" action="{% url 'account:login_view' %}" novalidate>
                                    {% csrf_token %}
                                    <div class="form-outline form-white mb-3 mb-md-4">
                                        <input method="post" action="{% url 'account:login_view' %}" type="text" id="typeEmailX" class="form-control form-control-sm form-control-md-lg" name="username" required />
                                        {% csrf_token %}
                                        <label class="form-label" for="typeEmailX">Username</label>
                                    </div>
                                    <div class="form-outline form-white mb-3 mb-md-4">
                                        <input method="post" action="{% url 'account:login_view' %}" type="password" id="typePasswordX" class="form-control form-control-sm form-control-md-lg" name="password"  required />
                                        {% csrf_token %}
                                        <label class="form-label" for="typePasswordX">Password</label>
                                    </div>
                                    <p class="small mb-3 mb-md-4 pb-lg-2">
                                        <a class="text-white-50" href="#!">Forgot password?</a>
                                    </p>
                                    <button class="btn btn-outline-light btn-sm btn-md-lg px-4 px-md-5" type="submit">Login</button>
                                </form>
                            </div>
                            <div>
                                <p class="mb-0">Don't have an account? <a href="{% url 'account:signup_view' %}" class="text-white-50 fw-bold">Sign Up</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
